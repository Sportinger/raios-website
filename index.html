<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070a">
  <title>raiOS · Scroll Layers</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
        "@pmndrs/vanilla/": "https://cdn.jsdelivr.net/npm/@pmndrs/vanilla@1.25.0/"
      }
    }
  </script>
</head>
<body>
  <main class="scroll-stage" aria-label="Abstrakte Layer-Animation">
    <div class="viewport">
      <canvas id="layer-canvas" aria-hidden="true"></canvas>
      <output id="scroll-debug" class="scroll-debug" aria-hidden="true"></output>
      <div id="glass-controls" class="glass-controls"></div>
      <nav
        id="chapter-navigation"
        class="chapter-navigation"
        aria-label="Kapitel-Navigation"
      ></nav>
    </div>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
